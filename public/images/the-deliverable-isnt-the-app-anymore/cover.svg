<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cover: an app in the center, connected to a chat room, a code repository, a database, a shield, a gauge, and an agent at a desktop">
